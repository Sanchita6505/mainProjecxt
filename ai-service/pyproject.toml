[project]
name = "ai-service"
version = "0.1.0"
description = "FastAPI AI microservice for DilliBites"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "asyncpg>=0.30.0",
    "chromadb==0.4.24",
    "fastapi>=0.124.4",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "onnxruntime==1.18.1",
    "posthog==2.5.0",
    "pulsar-client==3.5.0",
    "pydantic-settings>=2.8.1",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0.51",
    "tokenizers==0.20.3",
    "uvicorn[standard]>=0.33.0",
]

[project.scripts]
ai-service = "main:main"

[tool.ai-service]
api-version = "v1"
global-rate-limit = "100/minute"
database-driver = "asyncpg"

[dependency-groups]
dev = []
